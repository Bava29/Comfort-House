<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comfort House</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">


    <!-- =========================
     REGISTER PAGE
========================= -->

    <main class="auth-page">

        <!-- Top Controls -->
        <div class="auth-page-controls">

            <button type="button" class="auth-control-btn" id="darkModeToggle">
                <i class="fa-solid fa-moon"></i>
            </button>

            <button type="button" class="auth-control-btn" id="rtlToggle">
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
            </button>

        </div>


        <!-- Register Card -->
        <div class="auth-card register-card">

            <!-- Logo -->
            <div class="auth-logo">
                <a href="index.html">
                    <img src="images/logo.png" alt="Comfort House">
                </a>
            </div>


            <!-- Heading -->
            <div class="auth-heading">

                <span>JOIN COMFORT HOUSE</span>

                <h1>Create Account</h1>

                <p>
                    Create your account and make every night more comfortable.
                </p>

            </div>


            <!-- Register Form -->
            <form class="auth-form">

                <!-- Full Name -->
                <div class="auth-form-group">

                    <label for="register-name">
                        Full Name
                    </label>

                    <div class="auth-input">

                        <i class="fa-regular fa-user"></i>

                        <input type="text" id="register-name" name="name" placeholder="Enter your full name" required>

                    </div>

                </div>


                <!-- Email -->
                <div class="auth-form-group">

                    <label for="register-email">
                        Email Address
                    </label>

                    <div class="auth-input">

                        <i class="fa-regular fa-envelope"></i>

                        <input type="email" id="register-email" name="email" placeholder="you@example.com" required>

                    </div>

                </div>


                <!-- Password -->
                <div class="auth-form-group">

                    <label for="register-password">
                        Password
                    </label>

                    <div class="auth-input">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="register-password" name="password" placeholder="Create a password"
                            required>

                        <button type="button" class="password-toggle" aria-label="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="auth-form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <div class="auth-input">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="confirm-password" name="confirm-password"
                            placeholder="Confirm your password" required>

                        <button type="button" class="password-toggle" aria-label="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- Terms -->
                <label class="register-terms">

                    <input type="checkbox" required>

                    <span>
                        I agree to the
                        <a href="#">Terms & Conditions</a>
                        and
                        <a href="#">Privacy Policy</a>.
                    </span>

                </label>


                <!-- Submit -->
                <button type="submit" class="auth-submit">

                    Create Account

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>


            <!-- Divider -->
            <div class="auth-divider">

                <span>OR CONTINUE WITH</span>

            </div>


            <!-- Social Login -->
            <div class="auth-socials">

                <a href="#" class="social-btn google-btn">

                    <img src="images/google-logo.svg" alt="Google">

                    <span>Google</span>

                </a>


                <a href="#" class="social-btn facebook-btn">

                    <i class="fa-brands fa-facebook-f"></i>

                    <span>Facebook</span>

                </a>


                <a href="#" class="social-btn apple-btn">

                    <i class="fa-brands fa-apple"></i>

                    <span>Apple</span>

                </a>

            </div>


            <!-- Login Link -->
            <div class="auth-register">

                <span>Already have an account?</span>

                <a href="login.html">

                    Sign In

                    <i class="fa-solid fa-arrow-right"></i>

                </a>

            </div>

        </div>

    </main>


    <script src="js/main.js"></script>

</body>

</html>
