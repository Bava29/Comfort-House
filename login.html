<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comfort House</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">


    <!-- =========================
     LOGIN PAGE
========================= -->

    <main class="auth-page">

        <!-- Top Controls -->
        <div class="auth-page-controls">

            <button type="button" class="auth-control-btn" id="darkModeToggle">
                <i class="fa-solid fa-moon"></i>
            </button>

            <button type="button" class="auth-control-btn" id="rtlToggle">
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
            </button>

        </div>


        <!-- Login Card -->
        <div class="auth-card">

            <div class="auth-logo">
                <a href="index.html">
                    <img src="images/logo.png" alt="Comfort House">
                </a>
            </div>

            <div class="auth-heading">
                <span>WELCOME BACK</span>

                <h1>Welcome Back</h1>

                <p>
                    Sign in to continue your comfort journey.
                </p>
            </div>


            <form class="auth-form">

                <div class="auth-form-group">
                    <label for="login-email">Email Address</label>

                    <div class="auth-input">
                        <i class="fa-regular fa-envelope"></i>

                        <input type="email" id="login-email" placeholder="Enter your email" required>
                    </div>
                </div>


                <div class="auth-form-group">
                    <label for="login-password">Password</label>

                    <div class="auth-input">
                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="login-password" placeholder="Enter your password" required>

                        <button type="button" class="password-toggle" aria-label="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>


                <div class="auth-options">

                    <label class="remember-option">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>


                <button type="submit" class="auth-submit">
                    Sign In
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>


            <div class="auth-divider">
                <span>OR CONTINUE WITH</span>
            </div>


            <div class="auth-socials">

                <a href="#" class="social-btn google-btn">
                    <img src="images/google-logo.svg" alt="Google">
                    <span>Google</span>
                </a>

                <a href="#" class="social-btn facebook-btn">
                    <i class="fa-brands fa-facebook-f"></i>
                    <span>Facebook</span>
                </a>

                <a href="#" class="social-btn apple-btn">
                    <i class="fa-brands fa-apple"></i>
                    <span>Apple</span>
                </a>

            </div>


            <div class="auth-register">
                <span>Don't have an account?</span>

                <a href="register.html">
                    Create an account
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>

        </div>

    </main>


    <script src="js/main.js"></script>

</body>

</html>
